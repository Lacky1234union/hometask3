services:
  app:
    build: .
    environment:
      GREETING: ${GREETING:-Hello, Docker!}
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - target: 8000
        published: "${HOST_PORT:-8080}"
        host_ip: 127.0.0.1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 10
    read_only: true
    mem_limit: 256m
    cpus: 1.0

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  redis-data:
